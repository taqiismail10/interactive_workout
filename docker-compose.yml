services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: interactive_workout
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d interactive_workout"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: ./db
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/interactive_workout
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/interactive_workout
      ORIGIN: http://localhost:3000
      ADDR: ":8080"
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/waitlist/count || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  web:
    build:
      context: ./web
      args:
        # NEXT_PUBLIC_* vars are baked into the JS bundle at build time.
        # Set this to the public host:port where the API is reachable from browsers.
        NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:

